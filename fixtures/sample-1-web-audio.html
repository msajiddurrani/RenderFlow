<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="render-duration" content="3">
  <meta name="render-fps" content="30">
  <title>Sample 1: Web Audio Synthesis & Canvas Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    #canvas {
      border: 4px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      background: #161b22;
    }
    .badge {
      margin-top: 20px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .hud {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 24px;
      font-family: monospace;
      color: #7ee787;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Time: 0.00s | Frame: 0/90</div>
  <canvas id="canvas" width="1600" height="900"></canvas>
  <div class="badge">SAMPLE 1: Web Audio (Synth Oscillators) + Canvas 1080p</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const DURATION = 3.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;

    // Web Audio Setup
    let audioCtx = null;
    let masterGain = null;
    const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C

    function initAudio() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);
    }

    // Schedule audio notes
    function playNoteAt(time, freq, dur) {
      if (!audioCtx) initAudio();
      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, time);
      noteGain.gain.setValueAtTime(0.3, time);
      noteGain.gain.exponentialRampToValueAtTime(0.001, time + dur);
      osc.connect(noteGain);
      noteGain.connect(masterGain);
      osc.start(time);
      osc.stop(time + dur);
    }

    // Export Offline Audio Buffer for frame-stepping pipeline
    window.__bakeAudioWav = async function(sampleRate = 44100) {
      const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const offCtx = new OfflineCtx(1, sampleRate * DURATION, sampleRate);
      for (let i = 0; i < 6; i++) {
        const t = i * 0.5;
        const freq = notes[i % notes.length];
        const osc = offCtx.createOscillator();
        const noteGain = offCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);
        noteGain.gain.setValueAtTime(0.4, t);
        noteGain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(noteGain);
        noteGain.connect(offCtx.destination);
        osc.start(t);
        osc.stop(t + 0.45);
      }
      const renderedBuffer = await offCtx.startRendering();
      return audioBufferToWav(renderedBuffer);
    };

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = buffer.sampleRate;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1); // PCM
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      // return as base64 string
      const bytes = new Uint8Array(out.buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    // Frame rendering function (can be driven by virtual clock or rAF)
    window.renderFrame = function(frameIndex) {
      const progress = frameIndex / TOTAL_FRAMES;
      const t = frameIndex / FPS;
      hud.textContent = `Time: ${t.toFixed(2)}s | Frame: ${frameIndex}/${TOTAL_FRAMES}`;

      // Canvas background
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rotating neon spiral
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const angle = progress * Math.PI * 4;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      for (let i = 0; i < 180; i++) {
        const radius = i * 4;
        const currentAngle = i * 0.1;
        const x = Math.cos(currentAngle) * radius;
        const y = Math.sin(currentAngle) * radius;

        const hue = (i * 2 + progress * 360) % 360;
        ctx.fillStyle = `hsl(${hue}, 85%, 60%)`;
        ctx.beginPath();
        ctx.arc(x, y, 6 + Math.sin(progress * 10 + i * 0.1) * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Audio frequency wave bars at bottom
      const barCount = 32;
      const barWidth = canvas.width / barCount;
      for (let i = 0; i < barCount; i++) {
        const barHeight = 80 + Math.sin(progress * 12 + i * 0.5) * 60;
        ctx.fillStyle = `rgba(88, 166, 255, ${0.4 + (barHeight / 140) * 0.6})`;
        ctx.fillRect(i * barWidth + 4, canvas.height - barHeight - 20, barWidth - 8, barHeight);
      }
    };

    // Auto-run with standard rAF for real-time preview
    let currentFrame = 0;
    function loop() {
      if (window.__STANDALONE_STEPPING__) return;
      window.renderFrame(currentFrame % TOTAL_FRAMES);
      currentFrame++;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
