<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="render-duration" content="3">
  <meta name="render-fps" content="30">
  <title>Sample 4: Three.js WebGL at 1080p (Software Rendering)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: #020617;
      overflow: hidden;
      position: relative;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #webgl-container {
      width: 1920px;
      height: 1080px;
      display: block;
    }
    .hud {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 28px;
      font-family: monospace;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      z-index: 10;
    }
    .card {
      position: absolute;
      bottom: 50px;
      left: 60px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 20px 30px;
      color: #f8fafc;
      font-size: 20px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .card span {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Time: 0.00s | Frame: 0/90</div>
  <div id="webgl-container"></div>
  <div class="card">
    <div>WebGL 1080p Benchmark: <span>1920 x 1080</span></div>
    <div>Renderer: <span id="renderer-info">Detecting...</span></div>
  </div>

  <script type="module">
    import * as THREE from './vendor/three.module.js';

    const DURATION = 3.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;
    const container = document.getElementById('webgl-container');
    const hud = document.getElementById('hud');
    const rendererInfo = document.getElementById('renderer-info');

    // Setup Three.js scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050816);

    const camera = new THREE.PerspectiveCamera(50, 1920 / 1080, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(1);
    container.appendChild(renderer.domElement);

    // Get WebGL unmasked renderer info (e.g. SwiftShader or hardware GL)
    const gl = renderer.getContext();
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    if (debugInfo) {
      const unmaskedRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      rendererInfo.textContent = unmaskedRenderer;
    } else {
      rendererInfo.textContent = 'Standard WebGL';
    }

    // Geometry: Central faceted diamond + rings
    const mainGeometry = new THREE.IcosahedronGeometry(2, 1);
    const mainMaterial = new THREE.MeshPhongMaterial({
      color: 0x38bdf8,
      emissive: 0x075985,
      specular: 0xffffff,
      shininess: 100,
      flatShading: true
    });
    const mainMesh = new THREE.Mesh(mainGeometry, mainMaterial);
    scene.add(mainMesh);

    // Torus orbital ring
    const ringGeometry = new THREE.TorusGeometry(3.2, 0.08, 16, 100);
    const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x818cf8, wireframe: true });
    const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
    scene.add(ringMesh);

    // Orbiting particles
    const particleCount = 200;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 12;
      particlePositions[i+1] = (Math.random() - 0.5) * 8;
      particlePositions[i+2] = (Math.random() - 0.5) * 10;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.08 });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x334155, 1.5);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 2);
    dirLight1.position.set(5, 5, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xf43f5e, 1.5);
    dirLight2.position.set(-5, -5, -3);
    scene.add(dirLight2);

    // Deterministic frame rendering function
    window.renderFrame = function(frameIndex) {
      const progress = frameIndex / TOTAL_FRAMES;
      const t = frameIndex / FPS;
      hud.textContent = `Time: ${t.toFixed(2)}s | Frame: ${frameIndex}/${TOTAL_FRAMES}`;

      // Animate 3D rotations deterministically
      mainMesh.rotation.x = progress * Math.PI * 2;
      mainMesh.rotation.y = progress * Math.PI * 4;

      ringMesh.rotation.x = Math.PI / 4 + progress * Math.PI * 2;
      ringMesh.rotation.y = progress * Math.PI * 2;

      particles.rotation.y = -progress * Math.PI;

      renderer.render(scene, camera);
    };

    let currentFrame = 0;
    function loop() {
      if (window.__STANDALONE_STEPPING__) return;
      window.renderFrame(currentFrame % TOTAL_FRAMES);
      currentFrame++;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
