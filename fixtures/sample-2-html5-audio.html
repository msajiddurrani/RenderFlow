<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="render-duration" content="3">
  <meta name="render-fps" content="30">
  <title>Sample 2: HTML5 &lt;audio&gt; Tag + CSS Keyframe Animations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%);
      color: #cdd6f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card {
      width: 1200px;
      height: 600px;
      background: rgba(30, 30, 46, 0.7);
      backdrop-filter: blur(16px);
      border: 2px solid #fab387;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 40px;
    }
    h1 {
      font-size: 48px;
      color: #fab387;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .balls-container {
      display: flex;
      gap: 50px;
      align-items: flex-end;
      height: 250px;
    }
    .ball {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f38ba8, #e64553);
      box-shadow: 0 10px 25px rgba(243, 139, 168, 0.5);
    }
    .progress-bar-wrap {
      width: 1000px;
      height: 24px;
      background: #313244;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #45475a;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a6e3a1, #f9e2af, #fab387);
      transition: width 0.033s linear;
    }
    .hud {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 28px;
      font-family: monospace;
      color: #fab387;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Time: 0.00s | Frame: 0/90</div>
  
  <div class="card">
    <h1>SAMPLE 2: HTML5 &lt;audio&gt; + CSS/DOM Sync</h1>
    
    <div class="balls-container">
      <div class="ball" id="b1"></div>
      <div class="ball" id="b2" style="background: radial-gradient(circle at 30% 30%, #a6e3a1, #40a02b);"></div>
      <div class="ball" id="b3" style="background: radial-gradient(circle at 30% 30%, #89b4fa, #1e66f5);"></div>
      <div class="ball" id="b4" style="background: radial-gradient(circle at 30% 30%, #cba6f7, #8839ef);"></div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Standard HTML5 audio element playing test-sound.wav -->
  <audio id="audioElement" src="test-sound.wav" preload="auto"></audio>

  <script>
    const DURATION = 3.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;
    const audio = document.getElementById('audioElement');
    const hud = document.getElementById('hud');
    const progressFill = document.getElementById('progressFill');
    const balls = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3'), document.getElementById('b4')];

    window.renderFrame = function(frameIndex) {
      const progress = frameIndex / TOTAL_FRAMES;
      const t = frameIndex / FPS;
      hud.textContent = `Time: ${t.toFixed(2)}s | Frame: ${frameIndex}/${TOTAL_FRAMES}`;
      progressFill.style.width = `${progress * 100}%`;

      // Animate bouncing balls in sync with musical beats
      balls.forEach((b, idx) => {
        const offset = idx * 0.25;
        const bounce = Math.abs(Math.sin((t + offset) * Math.PI * 2));
        b.style.transform = `translateY(${-bounce * 140}px) scale(${1 + bounce * 0.15}, ${1 - bounce * 0.15})`;
      });

      // Synchronize audio element playback position if virtualized
      if (audio && !isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = t % audio.duration;
      }
    };

    let currentFrame = 0;
    function loop() {
      if (window.__STANDALONE_STEPPING__) return;
      window.renderFrame(currentFrame % TOTAL_FRAMES);
      currentFrame++;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
