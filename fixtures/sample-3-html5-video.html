<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="render-duration" content="3">
  <meta name="render-fps" content="30">
  <title>Sample 3: HTML5 &lt;video&gt; Overlay & Audio Extraction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }
    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
      opacity: 0.85;
    }
    .overlay-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }
    .hud {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 28px;
      font-family: monospace;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.6);
      z-index: 10;
    }
    .lower-third {
      position: absolute;
      bottom: 80px;
      left: 100px;
      background: rgba(15, 23, 42, 0.9);
      border-left: 8px solid #00ffcc;
      padding: 24px 40px;
      border-radius: 0 16px 16px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 10;
      transform: translateX(0);
      transition: transform 0.1s ease;
    }
    .lower-third h2 {
      font-size: 36px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .lower-third p {
      font-size: 22px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Time: 0.00s | Frame: 0/90</div>

  <video id="videoElement" src="test-video.mp4" muted="false" preload="auto"></video>
  <div class="overlay-vignette"></div>

  <div class="lower-third" id="lowerThird">
    <h2>SAMPLE 3: Video-in-Video Compositor</h2>
    <p>Frame-stepped HTML5 &lt;video&gt; playback with live audio track</p>
  </div>

  <script>
    const DURATION = 3.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;
    const video = document.getElementById('videoElement');
    const hud = document.getElementById('hud');
    const lowerThird = document.getElementById('lowerThird');

    // Seek the video element synchronously per frame
    window.renderFrame = function(frameIndex) {
      const progress = frameIndex / TOTAL_FRAMES;
      const t = frameIndex / FPS;
      hud.textContent = `Time: ${t.toFixed(2)}s | Frame: ${frameIndex}/${TOTAL_FRAMES}`;

      // Synchronize video element playback position
      if (video && !isNaN(video.duration) && video.duration > 0) {
        video.currentTime = Math.min(t, video.duration - 0.001);
      }

      // Animated lower third slide-in and bounce
      const slideIn = Math.min(1, progress * 4);
      lowerThird.style.transform = `translateX(${(1 - slideIn) * -400}px)`;
      lowerThird.style.opacity = `${slideIn}`;
    };

    let currentFrame = 0;
    function loop() {
      if (window.__STANDALONE_STEPPING__) return;
      window.renderFrame(currentFrame % TOTAL_FRAMES);
      currentFrame++;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
