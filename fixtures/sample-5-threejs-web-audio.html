<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="render-duration" content="3">
  <meta name="render-fps" content="30">
  <title>Sample 5: Combined Three.js 1080p + Web Audio Pipeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: #000000;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #webgl-canvas {
      width: 1920px;
      height: 1080px;
      display: block;
    }
    .hud {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 28px;
      font-family: monospace;
      color: #a855f7;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
      z-index: 10;
    }
    .banner {
      position: absolute;
      top: 40px;
      right: 60px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid #a855f7;
      padding: 16px 28px;
      border-radius: 12px;
      color: #fafafa;
      font-size: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Time: 0.00s | Frame: 0/90</div>
  <div class="banner">SAMPLE 5: Three.js 1080p + AudioContext Synth</div>
  <div id="webgl-canvas"></div>

  <script type="module">
    import * as THREE from './vendor/three.module.js';

    const DURATION = 3.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;
    const container = document.getElementById('webgl-canvas');
    const hud = document.getElementById('hud');

    // 1. Web Audio Offline Synthesizer for Baking
    window.__bakeAudioWav = async function(sampleRate = 44100) {
      const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const offCtx = new OfflineCtx(1, sampleRate * DURATION, sampleRate);
      const bassNotes = [110, 130.81, 146.83, 164.81]; // A2, C3, D3, E3

      for (let i = 0; i < 6; i++) {
        const t = i * 0.5;
        const freq = bassNotes[i % bassNotes.length];
        const osc = offCtx.createOscillator();
        const gain = offCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
        osc.connect(gain);
        gain.connect(offCtx.destination);
        osc.start(t);
        osc.stop(t + 0.45);
      }
      const renderedBuffer = await offCtx.startRendering();
      return exportWavBase64(renderedBuffer);
    };

    function exportWavBase64(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = buffer.sampleRate;
      let offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); // RIFF WAVE
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan); // fmt
      setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16);
      setUint32(0x61746164); setUint32(length - pos - 4); // data

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      const bytes = new Uint8Array(out.buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // 2. Three.js Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1920 / 1080, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(1);
    container.appendChild(renderer.domElement);

    // Dynamic wave mesh
    const gridX = 40, gridY = 40;
    const geometry = new THREE.PlaneGeometry(16, 12, gridX - 1, gridY - 1);
    const material = new THREE.MeshStandardMaterial({
      color: 0x9333ea,
      roughness: 0.2,
      metalness: 0.8,
      wireframe: true
    });
    const plane = new THREE.Mesh(geometry, material);
    plane.rotation.x = -Math.PI / 3;
    scene.add(plane);

    // Glowing core sphere
    const sphereGeo = new THREE.SphereGeometry(1.5, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0xa855f7,
      emissive: 0x6b21a8,
      roughness: 0.1
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.y = 1.5;
    scene.add(sphere);

    // Lights
    const pLight = new THREE.PointLight(0xd946ef, 3, 50);
    pLight.position.set(0, 4, 4);
    scene.add(pLight);
    const ambient = new THREE.AmbientLight(0x27272a, 1.2);
    scene.add(ambient);

    const pos = geometry.attributes.position;

    // Render frame
    window.renderFrame = function(frameIndex) {
      const progress = frameIndex / TOTAL_FRAMES;
      const t = frameIndex / FPS;
      hud.textContent = `Time: ${t.toFixed(2)}s | Frame: ${frameIndex}/${TOTAL_FRAMES}`;

      // Deform grid vertices dynamically
      for (let i = 0; i < pos.count; i++) {
        const u = (i % gridX) / gridX;
        const v = Math.floor(i / gridX) / gridY;
        const wave = Math.sin(u * 10 + progress * Math.PI * 4) * Math.cos(v * 10 + progress * Math.PI * 4);
        pos.setZ(i, wave * 1.2);
      }
      pos.needsUpdate = true;

      // Pulsate sphere
      const scale = 1 + Math.sin(progress * Math.PI * 6) * 0.25;
      sphere.scale.set(scale, scale, scale);
      sphere.rotation.y = progress * Math.PI * 2;

      renderer.render(scene, camera);
    };

    let currentFrame = 0;
    function loop() {
      if (window.__STANDALONE_STEPPING__) return;
      window.renderFrame(currentFrame % TOTAL_FRAMES);
      currentFrame++;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
