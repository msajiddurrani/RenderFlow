<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body { margin:0; background:#0f172a; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
    #box { width:220px; height:220px; background:linear-gradient(135deg,#6366f1,#ec4899); border-radius:28px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; box-shadow:0 20px 40px rgba(99,102,241,0.4); }
  </style>
</head>
<body>
  <div id="box">MOTION</div>
  <script>
    window.DUR = 5;
    const tl = gsap.timeline({ paused: true });
    tl.from('#box', { scale: 0, rotation: -180, duration: 2, ease: "elastic.out(1, 0.5)" })
      .to('#box', { rotation: 360, duration: 3, ease: "power2.inOut" });
    window.seek = t => tl.time(t);
  </script>
</body>
</html>
