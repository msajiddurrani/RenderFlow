<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0A0C16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .container {
      text-align: center;
      animation: fadeIn 1s ease-out;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818CF8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #FFFFFF 0%, #A5B4FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 20px;
      color: #94A3B8;
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.5;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: #4F46E5;
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.4);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Motion from Code</div>
    <h1>RenderFlow</h1>
    <p>High performance 1080p video synthesis from HTML & Markdown.</p>
    <div class="pill">Hardware GPU Accelerated</div>
  </div>
  <script>
    window.DURATION = 5;
  </script>
</body>
</html>
